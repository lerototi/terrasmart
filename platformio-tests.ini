; [TESTE] Experimental and bench environments.
; Usage: pio run -c platformio-tests.ini -e <environment>
; Production environments and shared settings are loaded from platformio.ini.

[platformio]
extra_configs = platformio.ini
default_envs = d1_mini_node

; Isolated radio diagnostics: MAC-identified ESP32 beacons and an ESP8266 receiver.
[env:esp32dev_espnow_probe_gateway_1]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_BEACON
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:esp32dev_espnow_probe_gateway_2]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_BEACON
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; Unicast diagnostic: ESP32 diagnostic receiver STA MAC.
[env:esp32dev_espnow_probe_gateway_unicast]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_UNICAST_TEST
    -DRSSI_PROBE_CHANNEL=1
    -DRSSI_PROBE_DEST_MAC_0=0xD4
    -DRSSI_PROBE_DEST_MAC_1=0xE9
    -DRSSI_PROBE_DEST_MAC_2=0xF4
    -DRSSI_PROBE_DEST_MAC_3=0x02
    -DRSSI_PROBE_DEST_MAC_4=0xE5
    -DRSSI_PROBE_DEST_MAC_5=0xEC
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; ESP32 receiver used to isolate the ESP8266 receive path from gateway radio behavior.
[env:esp32dev_espnow_probe_receiver]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_espnow_probe_receiver]
platform = espressif8266
board = d1_mini
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/librarie
monitor_speed = 74880
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

; Experimental node/gateway link test; does not initialize production FDRS.
[env:esp32dev_discovery_gateway_probe]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_discovery_probe.cpp>
build_flags =
    -DESPNOW_DISCOVERY_GATEWAY_PROBE
    -DRSSI_PROBE_CHANNEL=1
    -DDISCOVERY_GATEWAY_MAC_0=0xAA
    -DDISCOVERY_GATEWAY_MAC_1=0xBB
    -DDISCOVERY_GATEWAY_MAC_2=0xCC
    -DDISCOVERY_GATEWAY_MAC_3=0xDD
    -DDISCOVERY_GATEWAY_MAC_4=0xEE
    -DDISCOVERY_GATEWAY_MAC_5=0x01
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_discovery_node_probe]
platform = espressif8266
board = d1_mini
upload_speed = 115200
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_discovery_probe.cpp>
build_flags =
    -DESPNOW_DISCOVERY_NODE_PROBE
    -DRSSI_PROBE_CHANNEL=1
    -DDISCOVERY_GATEWAY_MAC_0=0xAA
    -DDISCOVERY_GATEWAY_MAC_1=0xBB
    -DDISCOVERY_GATEWAY_MAC_2=0xCC
    -DDISCOVERY_GATEWAY_MAC_3=0xDD
    -DDISCOVERY_GATEWAY_MAC_4=0xEE
    -DDISCOVERY_GATEWAY_MAC_5=0x01
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src
monitor_speed = 74880

[env:esp32dev_discovery_gateway_probe_2]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_discovery_probe.cpp>
build_flags =
    -DESPNOW_DISCOVERY_GATEWAY_PROBE
    -DRSSI_PROBE_CHANNEL=1
    -DDISCOVERY_GATEWAY_MAC_0=0xAA
    -DDISCOVERY_GATEWAY_MAC_1=0xBB
    -DDISCOVERY_GATEWAY_MAC_2=0xCC
    -DDISCOVERY_GATEWAY_MAC_3=0xDD
    -DDISCOVERY_GATEWAY_MAC_4=0xEE
    -DDISCOVERY_GATEWAY_MAC_5=0x02
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; Bench-only incompatible-network gateway, used to verify isolation.
[env:esp32dev_discovery_gateway_other_network]
extends = env:esp32dev_discovery_gateway_probe_2
build_flags =
    ${env:esp32dev_discovery_gateway_probe_2.build_flags}
    -DTERRASMART_DISCOVERY_NETWORK_ID=0x54530102UL

[env:d1_mini_discovery_node_probe_2]
platform = espressif8266
board = d1_mini
upload_speed = 115200
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_discovery_probe.cpp>
build_flags =
    -DESPNOW_DISCOVERY_NODE_PROBE
    -DRSSI_PROBE_CHANNEL=1
    -DDISCOVERY_GATEWAY_MAC_0=0xAA
    -DDISCOVERY_GATEWAY_MAC_1=0xBB
    -DDISCOVERY_GATEWAY_MAC_2=0xCC
    -DDISCOVERY_GATEWAY_MAC_3=0xDD
    -DDISCOVERY_GATEWAY_MAC_4=0xEE
    -DDISCOVERY_GATEWAY_MAC_5=0x02
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src
monitor_speed = 74880

; Experimental dynamic discovery node, compatible with the link probe gateways.
[env:esp32dev_discovery_node_experimental]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_discovery_node.cpp>
build_flags =
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_discovery_node_experimental]
platform = espressif8266
board = d1_mini
upload_speed = 115200
monitor_speed = 74880
board_build.ldscript = eagle.flash.4m1m.ld
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_discovery_node.cpp>
build_flags =
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

; PR 7a isolated data pilot: configure the gateway's factory STA MAC below.
[env:esp32dev_data_v1_pilot]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_data_pilot.cpp>
build_flags =
    -DESPNOW_DATA_PILOT_GATEWAY
    -DPILOT_GATEWAY_MAC_0=0x38
    -DPILOT_GATEWAY_MAC_1=0x3E
    -DPILOT_GATEWAY_MAC_2=0x51
    -DPILOT_GATEWAY_MAC_3=0xD3
    -DPILOT_GATEWAY_MAC_4=0xE3
    -DPILOT_GATEWAY_MAC_5=0x74
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_data_v1_pilot]
platform = espressif8266
board = d1_mini
upload_speed = 115200
monitor_speed = 74880
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_data_pilot.cpp>
build_flags =
    -DESPNOW_DATA_PILOT_NODE
    -DPILOT_GATEWAY_MAC_0=0x38
    -DPILOT_GATEWAY_MAC_1=0x3E
    -DPILOT_GATEWAY_MAC_2=0x51
    -DPILOT_GATEWAY_MAC_3=0xD3
    -DPILOT_GATEWAY_MAC_4=0xE3
    -DPILOT_GATEWAY_MAC_5=0x74
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

; Dedicated UART/MQTT experiment: local credentials in ignored
; include/terrasmart_pilot_secrets.h. Production environments are unchanged.
[env:esp32dev_data_uart_pilot]
extends = env:esp32dev_data_v1_pilot
build_flags =
    ${env:esp32dev_data_v1_pilot.build_flags}
    -DTERRASMART_PILOT_UART_BRIDGE

[env:d1_mini_data_v1_bench_node]
extends = env:d1_mini_data_v1_pilot
build_unflags = ${pilot_uart_bench_identity.build_unflags}
build_flags =
    ${env:d1_mini_data_v1_pilot.build_flags}
    ${pilot_uart_bench_identity.build_flags}

[env:d1_mini_uart_mqtt_pilot]
platform = espressif8266
board = d1_mini
upload_speed = 115200
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<uart_mqtt_pilot.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -DPILOT_GATEWAY_MAC_0=0x38
    -DPILOT_GATEWAY_MAC_1=0x3E
    -DPILOT_GATEWAY_MAC_2=0x51
    -DPILOT_GATEWAY_MAC_3=0xD3
    -DPILOT_GATEWAY_MAC_4=0xE3
    -DPILOT_GATEWAY_MAC_5=0x74
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

; Local bench setup using ignored include/terrasmart_secrets.h credentials.
[env:d1_mini_uart_mqtt_pilot_local]
extends = env:d1_mini_uart_mqtt_pilot
upload_speed = 57600
build_flags =
    ${env:d1_mini_uart_mqtt_pilot.build_flags}
    -DPILOT_USE_SHARED_SECRETS

[env:d1_mini_uart_mqtt_bench]
extends = env:d1_mini_uart_mqtt_pilot_local
build_unflags = ${pilot_uart_bench_identity.build_unflags}
build_flags =
    ${env:d1_mini_uart_mqtt_pilot_local.build_flags}
    ${pilot_uart_bench_identity.build_flags}

; ESP32 MQTT front-end for a separate ESP32 radio gateway over UART1.
[env:esp32dev_uart_mqtt_pilot]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<uart_mqtt_pilot.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    ${pilot_uart_bench_identity.build_flags}
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; Optional bench bridge through USB serial for testing when GPIO wiring is absent.
[env:esp32dev_data_uart_usb_test]
extends = env:esp32dev_data_uart_pilot
build_flags =
    ${env:esp32dev_data_uart_pilot.build_flags}
    -DPILOT_USB_UART_TEST

[env:esp32dev_data_v1_node_pilot]
extends = env:esp32dev_data_v1_pilot
build_flags =
    -DESPNOW_DATA_PILOT_NODE
    -DPILOT_GATEWAY_MAC_0=0x38
    -DPILOT_GATEWAY_MAC_1=0x3E
    -DPILOT_GATEWAY_MAC_2=0x51
    -DPILOT_GATEWAY_MAC_3=0xD3
    -DPILOT_GATEWAY_MAC_4=0xE3
    -DPILOT_GATEWAY_MAC_5=0x74
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_uart_mqtt_usb_test]
extends = env:d1_mini_uart_mqtt_pilot
build_flags =
    ${env:d1_mini_uart_mqtt_pilot.build_flags}
    -DPILOT_USB_UART_TEST
    -DPILOT_USE_SHARED_SECRETS
