; PlatformIO configuration for Farm Data Relay System examples.
; Select one environment in VS Code before building or uploading.

[platformio]
default_envs = d1_mini_node

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/terrasmart.py
lib_deps =
    https://github.com/timmbogner/Farm-Data-Relay-System.git#33fca6e8c3bd8f8fe5c0dac4c04648c80c6a7723
    bblanchon/ArduinoJson@^7.0.0

[env:d1_mini_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<node_sensor.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:d1_mini_float_switch_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<float_switch_node.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:d1_mini_relay_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<relay_node.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:esp32dev_gateway]
platform = espressif32@^7.0.1
board = esp32dev
board_build.partitions = partitions_ota.csv
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<gateway.cpp>
build_flags =
    -DFDRS_GATEWAY_FIRMWARE
    -DESP32DEV_GATEWAY_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_mqtt_gateway]
platform = espressif8266
board = d1_mini_pro
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<mqtt_gateway.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -DFDRS_MQTT_GATEWAY_FIRMWARE
    -DFDRS_RUNTIME_CONFIG
    -DTERRASMART_OTA_MQTT
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src
monitor_speed = 115200

[env:esp32dev_mqtt_gateway]
platform = espressif32@^7.0.1
board = esp32dev
board_build.partitions = partitions_ota.csv
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<mqtt_gateway.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -DFDRS_MQTT_GATEWAY_FIRMWARE
    -DESP32_MQTT_GATEWAY_FIRMWARE
    -DFDRS_RUNTIME_CONFIG
    -DTERRASMART_OTA_MQTT
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
monitor_speed = 115200

[env:wemos_d1_mini32_node]
platform = espressif32@^7.0.1
board = wemos_d1_mini32
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<node_sensor.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; Isolated radio diagnostics: MAC-identified ESP32 beacons and an ESP8266 receiver.
[env:esp32dev_espnow_probe_gateway_1]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_BEACON
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:esp32dev_espnow_probe_gateway_2]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_BEACON
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; Unicast diagnostic: ESP32 diagnostic receiver STA MAC.
[env:esp32dev_espnow_probe_gateway_unicast]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_UNICAST_TEST
    -DRSSI_PROBE_CHANNEL=1
    -DRSSI_PROBE_DEST_MAC_0=0xD4
    -DRSSI_PROBE_DEST_MAC_1=0xE9
    -DRSSI_PROBE_DEST_MAC_2=0xF4
    -DRSSI_PROBE_DEST_MAC_3=0x02
    -DRSSI_PROBE_DEST_MAC_4=0xE5
    -DRSSI_PROBE_DEST_MAC_5=0xEC
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; ESP32 receiver used to isolate the ESP8266 receive path from gateway radio behavior.
[env:esp32dev_espnow_probe_receiver]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_espnow_probe_receiver]
platform = espressif8266
board = d1_mini
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/librarie
monitor_speed = 74880
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

; Experimental node/gateway link test; does not initialize production FDRS.
[env:esp32dev_discovery_gateway_probe]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_discovery_probe.cpp>
build_flags =
    -DESPNOW_DISCOVERY_GATEWAY_PROBE
    -DRSSI_PROBE_CHANNEL=1
    -DDISCOVERY_GATEWAY_MAC_0=0xAA
    -DDISCOVERY_GATEWAY_MAC_1=0xBB
    -DDISCOVERY_GATEWAY_MAC_2=0xCC
    -DDISCOVERY_GATEWAY_MAC_3=0xDD
    -DDISCOVERY_GATEWAY_MAC_4=0xEE
    -DDISCOVERY_GATEWAY_MAC_5=0x01
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

