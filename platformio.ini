; PlatformIO configuration for Farm Data Relay System examples.
; Select one environment in VS Code before building or uploading.

[platformio]
default_envs = d1_mini_node

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/terrasmart.py
lib_deps =
    https://github.com/timmbogner/Farm-Data-Relay-System.git#33fca6e8c3bd8f8fe5c0dac4c04648c80c6a7723
    bblanchon/ArduinoJson@^7.0.0

[env:d1_mini_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<node_sensor.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:d1_mini_float_switch_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<float_switch_node.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:d1_mini_relay_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<relay_node.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:esp32dev_gateway]
platform = espressif32@^7.0.1
board = esp32dev
board_build.partitions = partitions_ota.csv
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<gateway.cpp>
build_flags =
    -DFDRS_GATEWAY_FIRMWARE
    -DESP32DEV_GATEWAY_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_mqtt_gateway]
platform = espressif8266
board = d1_mini
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<mqtt_gateway.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -DFDRS_MQTT_GATEWAY_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src
    -DFDRS_OTA_PASSWORD=\"replace-this-in-deployment\"
monitor_speed = 115200

[env:esp32dev_mqtt_gateway]
platform = espressif32@^7.0.1
board = esp32dev
board_build.partitions = partitions_ota.csv
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<mqtt_gateway.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -DFDRS_MQTT_GATEWAY_FIRMWARE
    -DESP32_MQTT_GATEWAY_FIRMWARE
    -DFDRS_RUNTIME_CONFIG
    -DTERRASMART_OTA_MQTT
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
monitor_speed = 115200

[env:wemos_d1_mini32_node]
platform = espressif32@^7.0.1
board = wemos_d1_mini32
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<node_sensor.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; Isolated radio diagnostics: two ESP32 beacons and an ESP8266 receiver.
[env:esp32dev_espnow_probe_gateway_1]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_BEACON
    -DRSSI_PROBE_GATEWAY_ID=1
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:esp32dev_espnow_probe_gateway_2]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DESPNOW_RSSI_BEACON
    -DRSSI_PROBE_GATEWAY_ID=2
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:d1_mini_espnow_probe_receiver]
platform = espressif8266
board = d1_mini
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<espnow_rssi_probe.cpp>
build_flags =
    -DRSSI_PROBE_CHANNEL=1
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src
