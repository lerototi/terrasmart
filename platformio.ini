; TerraSmart production and current bench environments. Select one before upload.
; Other [TESTE] diagnostics: pio run -c platformio-tests.ini -e <name>

[platformio]
default_envs = d1_mini_node

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/terrasmart.py
lib_deps =
    https://github.com/timmbogner/Farm-Data-Relay-System.git#33fca6e8c3bd8f8fe5c0dac4c04648c80c6a7723
    bblanchon/ArduinoJson@^7.0.0

; === Nodes ESP8266 ===
[env:d1_mini_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<node_sensor.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:d1_mini_float_switch_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<float_switch_node.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

[env:d1_mini_relay_node]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<relay_node.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src

; === Nodes ESP32 ===
[env:wemos_d1_mini32_node]
platform = espressif32@^7.0.1
board = wemos_d1_mini32
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<node_sensor.cpp>
build_flags =
    -DFDRS_NODE_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; === Gateway ESP-NOW ESP32 ===
[env:esp32dev_gateway]
platform = espressif32@^7.0.1
board = esp32dev
board_build.partitions = partitions_ota.csv
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<gateway.cpp>
build_flags =
    -DFDRS_GATEWAY_FIRMWARE
    -DESP32DEV_GATEWAY_FIRMWARE
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; === Gateways MQTT ESP8266 / ESP32 ===
[env:d1_mini_mqtt_gateway]
platform = espressif8266
board = d1_mini_pro
upload_protocol = esptool
upload_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
build_src_filter =
    -<*>
    +<mqtt_gateway.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -DFDRS_MQTT_GATEWAY_FIRMWARE
    -DFDRS_RUNTIME_CONFIG
    -DTERRASMART_OTA_MQTT
    -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src
monitor_speed = 115200

[env:esp32dev_mqtt_gateway]
platform = espressif32@^7.0.1
board = esp32dev
board_build.partitions = partitions_ota.csv
lib_ldf_mode = deep+
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
build_src_filter =
    -<*>
    +<mqtt_gateway.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -DFDRS_MQTT_GATEWAY_FIRMWARE
    -DESP32_MQTT_GATEWAY_FIRMWARE
    -DFDRS_RUNTIME_CONFIG
    -DTERRASMART_OTA_MQTT
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
monitor_speed = 115200

; === [TESTE] Current ESP32 UART/MQTT bench ===
; These pilots use the radio gateway's factory MAC D4:E9:F4:02:E5:EC.
; Change the identity consistently for both gateways and the synthetic node.
[pilot_uart_bench_identity]
build_unflags =
    -DPILOT_GATEWAY_MAC_0=0x38
    -DPILOT_GATEWAY_MAC_1=0x3E
    -DPILOT_GATEWAY_MAC_2=0x51
    -DPILOT_GATEWAY_MAC_3=0xD3
    -DPILOT_GATEWAY_MAC_4=0xE3
    -DPILOT_GATEWAY_MAC_5=0x74
build_flags =
    -DPILOT_GATEWAY_MAC_0=0xD4
    -DPILOT_GATEWAY_MAC_1=0xE9
    -DPILOT_GATEWAY_MAC_2=0xF4
    -DPILOT_GATEWAY_MAC_3=0x02
    -DPILOT_GATEWAY_MAC_4=0xE5
    -DPILOT_GATEWAY_MAC_5=0xEC

; Radio gateway, UART1 RX GPIO16 / TX GPIO17.
[env:esp32dev_data_uart_bench]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_data_pilot.cpp>
build_flags =
    -DESPNOW_DATA_PILOT_GATEWAY
    -DTERRASMART_PILOT_UART_BRIDGE
    ${pilot_uart_bench_identity.build_flags}
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

; MQTT gateway, using locally configured shared credentials when available.
[env:esp32dev_uart_mqtt_pilot_local]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<uart_mqtt_pilot.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    ${pilot_uart_bench_identity.build_flags}
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
    -DPILOT_USE_SHARED_SECRETS

; Validated fast-UART pair for the ESP32 pilot. Flash both gateways together;
; ESP8266 pilots and the original bench pair remain at 9600 for rollback.
[env:esp32dev_data_uart_fast_bench]
extends = env:esp32dev_data_uart_bench
build_flags =
    ${env:esp32dev_data_uart_bench.build_flags}
    -DTERRASMART_PILOT_UART_BAUD=115200

[env:esp32dev_uart_mqtt_fast_bench]
extends = env:esp32dev_uart_mqtt_pilot_local
build_flags =
    ${env:esp32dev_uart_mqtt_pilot_local.build_flags}
    -DTERRASMART_PILOT_UART_BAUD=115200

; Synthetic sensor node for the current radio gateway.
[env:esp32dev_data_v1_bench_node]
platform = espressif32@^7.0.1
board = esp32dev
lib_ldf_mode = deep+
build_src_filter =
    -<*>
    +<espnow_data_pilot.cpp>
build_flags =
    -DESPNOW_DATA_PILOT_NODE
    ${pilot_uart_bench_identity.build_flags}
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
